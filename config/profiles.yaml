      - Pharmaceutical industry and drug-development news with no bearing on outpatient
        facilities, pharmacy operations, or how outpatient cancer care is organized ->
        2-3.
      - National operational or workforce news with no South Florida or
        outpatient/clinical connection -> 3-4.
      Proximity is a multiplier, not a category: the same development is far more
      relevant inside the health system's own service area than several states away.
    # Union of Rafic's and Weiss's keyword_interests. Matched as WHOLE WORDS against
